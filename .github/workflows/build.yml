name: Build TaskFlow APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package*.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Cache Gradle (downloads and build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package*.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - run: npm install --prefer-offline --no-audit --no-fund
      - run: npx cap add android
      - name: Add notification and alarm permissions
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Fullscreen plugin (hide status bar, auto rotate only in focus full screen)
        run: |
          J=android/app/src/main/java/com/habit/tracker
          mkdir -p $J
          cp native/FullscreenModePlugin.java $J/FullscreenModePlugin.java
          cp native/BiometricAuthPlugin.java $J/BiometricAuthPlugin.java
          cp native/MainActivity.java $J/MainActivity.java
          cp native/NotifActionReceiver.java $J/NotifActionReceiver.java
          cp native/PendingActionsPlugin.java $J/PendingActionsPlugin.java
          sed -i '0,/android:name="\.MainActivity"/s//android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml
      - name: Fingerprint support (biometric library and permission)
        run: |
          sed -i '/^dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "biometric" android/app/build.gradle
      - name: Add storage permissions (for saving backups on Android 9 and below)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Python with Pillow (for icon and splash images, no slow apt download)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Black status bar and black launch screen
        run: |
          sed -i 's/#303F9F/#000000/g; s/#3F51B5/#000000/g' android/app/src/main/res/values/colors.xml || true
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in glob.glob('android/app/src/main/res/**/splash.png', recursive=True):
              w, h = Image.open(f).size
              Image.new('RGB', (w, h), (0, 0, 0)).save(f)
          PY
      - name: Black window background (fixes grey side strip in landscape)
        run: |
          S=android/app/src/main/res/values/styles.xml
          sed -i '/<style name="AppTheme.NoActionBar/a\        <item name="android:windowBackground">@android:color/black</item>\n        <item name="android:statusBarColor">@android:color/black</item>\n        <item name="android:navigationBarColor">@android:color/black</item>' $S
          grep -c "windowBackground" $S
      - name: Raise version code on every build (so the new APK installs over the old one)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Use the fixed signing key (keeps your data when updating)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: App launcher icon (only if assets/icon-only.png exists)
        run: |
          if [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' || echo "::warning::icon generation failed, default icon will be used"
          else
            echo "No assets/icon-only.png yet, using default icon"
          fi
      - name: Make sure adaptive icon background exists
        run: |
          python3 - <<'PY'
          import os
          from PIL import Image
          R = 'android/app/src/main/res'
          for d, s in [('mdpi',108),('hdpi',162),('xhdpi',216),('xxhdpi',324),('xxxhdpi',432)]:
              os.makedirs(f'{R}/mipmap-{d}', exist_ok=True)
              f = f'{R}/mipmap-{d}/ic_launcher_background.png'
              if not os.path.exists(f):
                  Image.new('RGB', (s, s), (0, 0, 0)).save(f)
          PY
      - name: Notification icons
        run: |
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          D = 'android/app/src/main/res/drawable'
          os.makedirs(D, exist_ok=True)
          def fit(src, n):
              im = Image.open(src).convert('RGBA')
              k = min(n / im.width, n / im.height)
              return im.resize((max(1, round(im.width * k)), max(1, round(im.height * k))), Image.LANCZOS)
          if os.path.exists('assets/icon-only.png'):
              fit('assets/icon-only.png', 192).save(D + '/ic_large_icon.png')
          else:
              Image.new('RGB', (192, 192), (0, 0, 0)).save(D + '/ic_large_icon.png')
          if os.path.exists('assets/notification-icon.png'):
              fit('assets/notification-icon.png', 96).save(D + '/ic_stat_icon.png')
          else:
              im = Image.new('RGBA', (96, 96), (0, 0, 0, 0))
              ImageDraw.Draw(im).ellipse((8, 8, 88, 88), fill=(255, 255, 255, 255))
              im.save(D + '/ic_stat_icon.png')
          PY
      - name: Notification buttons work silently (Yes / No / Snooze without opening the app)
        run: |
          python3 native/patch_notifications.py
          sed -i 's#</application>#    <receiver android:name="com.habit.tracker.NotifActionReceiver" android:exported="false"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "NotifActionReceiver" android/app/src/main/AndroidManifest.xml
      - name: Sharp launch screen icon (Android 12 and above)
        run: |
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/values-v31
          cp native/splash_icon.xml $R/drawable/splash_icon.xml
          cp native/splash-styles-v31.xml $R/values-v31/styles.xml
          grep -rn "NoActionBarLaunch" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TaskFlow.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TaskFlow.apk \
            --title "TaskFlow (build ${{ github.run_number }})" \
            --notes "TaskFlow latest build. Download TaskFlow.apk and install it over the old version." \
            --target ${{ github.sha }}
