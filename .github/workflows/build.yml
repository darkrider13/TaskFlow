name: Build TaskFlow APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare the fixed signing key (keeps your data when updating)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the key from GitHub Secrets"
          else
            echo "Signing with debug.keystore from the project"
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug -PvCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaskFlow.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TaskFlow.apk \
            --title "TaskFlow (build ${{ github.run_number }})" \
            --notes "TaskFlow latest build. Download TaskFlow.apk and install it over the old version." \
            --target ${{ github.sha }}
