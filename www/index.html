<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow</title>
<style>
:root{--bgc:#000;--bgi:none;--ink:#F4F4F5;--muted:rgba(244,244,245,.56);--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.16);--edge:rgba(255,255,255,.18);--hi:rgba(255,255,255,.2);--sh:rgba(0,0,0,.5);--panel:rgba(22,22,26,.78);--daybg:rgba(255,255,255,.06);--cross:#FF0000;--streak:#FFFF00;--shade:rgba(0,0,0,.6);--ac:#00FFFF;--tink:#041014;--mono:#fff}
:root[data-theme=light]{--mono:#000;--bgc:#E6EEF5;--bgi:radial-gradient(circle at 12% 6%,rgba(94,234,212,.55),transparent 42%),radial-gradient(circle at 92% 28%,rgba(167,139,250,.45),transparent 45%),radial-gradient(circle at 18% 96%,rgba(251,146,160,.4),transparent 45%);--ink:#10253A;--muted:rgba(16,37,58,.6);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.95);--hi:rgba(255,255,255,.9);--sh:rgba(40,70,110,.18);--panel:rgba(244,249,255,.85);--daybg:rgba(255,255,255,.45);--cross:#FF0000;--streak:#FFC400;--shade:rgba(16,37,58,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bgc)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bgi);background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;overscroll-behavior:none}
html{overflow:hidden;height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
html,body{overscroll-behavior-y:none}
.top{flex:none}
body>section{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 134px);scrollbar-width:none}
body>section::-webkit-scrollbar{display:none}
body>section.hid{display:none}
button{font-family:inherit}
.g{background:var(--glass);border:1px solid var(--edge);border-radius:18px;box-shadow:0 8px 28px var(--sh),inset 0 1px 0 var(--hi)}
.hid{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.user{background:none;border:0;padding:0;color:var(--ink);font-size:26px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px}
.user .ic{width:.9em;height:.9em}
.user.ph{font-size:15px;font-weight:500;color:var(--muted)}
h1{font-size:26px;margin:0}
h3{font-size:15px;margin:18px 2px 8px;color:var(--muted);font-weight:600}
.tools{display:flex;gap:8px}
.tbtn{min-width:42px;height:38px;padding:0 12px;border-radius:19px;border:0;box-shadow:none;background:transparent;color:var(--ink);font-size:15px}
.hero{padding:16px;margin-bottom:4px}
.hero small{color:var(--muted);font-size:13px}
.hero b{display:block;font-size:18px;margin:4px 0 12px}
.hero b.hn{font-size:13px;font-weight:500}
.bar{height:10px;border-radius:6px;background:var(--glass2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--mono,#fff);opacity:1;transition:width .4s}
.hab{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--ac)}
.hi{flex:1}.hi b{display:block;font-size:15px}.hi small{color:var(--muted);font-size:12.5px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:none;color:transparent;font-size:18px}
.chk.on{background:transparent;border-color:var(--mono);color:var(--mono);box-shadow:0 0 14px rgba(255,255,255,.25)}
.todo{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:8px;border-radius:14px}
.todo.p1{border-left:4px solid #FFFF00}.todo.p2{border-left:4px solid #FF0000}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo span{flex:1;font-size:15px}
.todo small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.todo button{background:none;border:0;font-size:17px;color:var(--cross)}
.todo button[data-e]{color:var(--muted);padding:6px;display:flex;align-items:center;justify-content:center}
.todo button[data-e] .ic{width:20px;height:20px}
input[type=checkbox]{width:22px;height:22px;accent-color:#00FFFF}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
section.emp:not(.hid){display:flex;flex-direction:column}
section.emp #ulist{flex:1;display:flex;flex-direction:column;min-height:0}
.es{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:0 26px;margin-top:-30px}
.es .ic{width:64px;height:64px;stroke-width:1.4;color:var(--muted);opacity:.55}
.es b{font-size:21px;font-weight:600;line-height:1.55;max-width:300px;color:var(--ink)}
.es .fabi{width:1.55em;height:1.55em;font-size:.8em}
.over h3{color:var(--cross)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;padding:8px 15px;border-radius:20px;color:var(--ink);font-size:15px;border:1px solid var(--edge);background:var(--glass)}
.chip.on{color:var(--tink);font-weight:700;border-color:transparent}
.chip.add{border-style:dashed;color:var(--muted)}
.card{padding:14px;margin-bottom:12px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;text-align:center}
.mini b{display:block;font-size:20px}.mini span{font-size:12px;color:var(--muted)}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin:10px 0 5px}
.pl em{font-style:normal;font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mnav button{background:none;border:0;font-size:24px;padding:6px 14px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.day{height:44px;border-radius:12px;font-size:14px;position:relative;color:var(--ink);display:flex;align-items:center;justify-content:center;border:1px solid var(--edge);background:var(--daybg)}
.day.e{background:none;border:0}
.day.today{border:2px solid var(--mono);box-shadow:none}
.day.pick:not(.today){border:2px solid #C9B6FF;box-shadow:none}:root[data-theme=light] .day.pick:not(.today){border-color:#A78BFA}
.day.hol{color:#FF0000}
.day.hol2{color:#FFB800}
.holn.o{background:rgba(255,184,0,.16);color:#FFB800}
:root[data-theme=light] .day.hol2{color:#FFB800}
.day.ev:not(.tick){color:#38BDF8}:root[data-theme=light] .day.ev:not(.tick){color:#0EA5E9}
:root[data-theme=light] .holn.o{background:rgba(255,184,0,.16);color:#FFB800}
.holn{margin:2px 0 10px;padding:8px 12px;border-radius:12px;background:rgba(255,0,0,.14);color:#FF0000;font-size:13px;font-weight:600;line-height:1.5}
.day.tick{background:var(--tc);color:var(--tink);font-weight:700;border-color:transparent;box-shadow:0 0 14px var(--tc)}
.day.cross{color:var(--muted)}
.day .m{position:absolute;top:2px;right:5px;font-size:12px;font-weight:700}
.day .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--mono)}
.hint{font-size:10.5px;line-height:1.4;color:var(--muted);margin:12px 2px}
.navb{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;padding:4px;border-radius:22px;z-index:5}
.navb button{flex:1;background:none;border:0;color:var(--muted);padding:5px 0 4px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px}
.navb button.on{color:var(--tink);background:var(--ac);font-weight:700}
.navb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fabi{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--edge);background:#000;color:#fff;font-size:.85em;line-height:1;vertical-align:middle;margin:0 .15em}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:#000;color:#fff;font-size:24px;line-height:1;z-index:5}
.sheet{position:fixed;inset:0;background:var(--shade);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:10}
body:has(.sheet.show) .fab{visibility:hidden}
.sheet.show{display:flex}
.panel{width:100%;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:90vh;overflow:auto;background:var(--panel);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--edge);border-bottom:0}
.panel h2{font-size:18px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{width:36px;height:36px;border-radius:50%;border:0;box-shadow:none;background:transparent;color:var(--ink);font-size:16px;flex:none}
.x .ic{width:22px;height:22px}
.big{width:100%;padding:13px;border-radius:14px;border:0;font-size:16px;font-weight:700;color:var(--tink);background:var(--ac);margin-bottom:12px}
.big.undo{background:var(--cross)}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--glass);margin-bottom:6px}
.seg button,.pri button{flex:1;padding:10px;border-radius:11px;border:0;background:none;color:var(--ink);font-size:14px}
.seg button.on,.pri button.on{background:var(--ac);color:var(--tink);font-weight:700}
.pri{display:flex;gap:6px;flex:1}
.pri button{border:1px solid var(--edge)}
.row{display:flex;gap:8px;margin-top:8px;align-items:center}
.row label{font-size:14px;flex:1}
input[type=text],input[type=time],input[type=number],input[type=date]{padding:11px;border-radius:12px;border:1px solid var(--edge);font-size:15px;background:var(--glass2);color:var(--ink);outline:0;font-family:inherit}
input[type=text]{flex:1;min-width:0}input[type=number]{width:90px}
::placeholder{color:var(--muted)}
.row>button{padding:13px 16px;border-radius:12px;border:1px solid var(--edge);background:var(--glass2);color:var(--ink);font-size:15px}
.link{background:none;border:0;padding:10px 12px 0 0;font-size:14px;color:var(--muted)}
.link.red{color:var(--cross)}
.wdays{display:flex;gap:5px;flex-wrap:wrap}
.wdays button{flex:1;min-width:38px;padding:9px 0;border-radius:10px;border:1px solid var(--edge);background:none;color:var(--ink);font-size:12.5px}
.wdays button.on{background:var(--ac);color:var(--tink);font-weight:700}
#rp button{padding:10px 4px;font-size:13px}
.day.off{opacity:.4}
textarea{width:100%;min-height:80px;margin-top:8px;padding:11px;border-radius:12px;border:1px solid var(--edge);font-size:13px;background:var(--glass2);color:var(--ink);outline:0;font-family:inherit}
.sub{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:7px;color:var(--muted)}
.sub input{width:18px;height:18px}
.todo .mv button{border:1px solid var(--edge);background:var(--glass2);color:var(--ink);border-radius:10px;padding:5px 11px;font-size:12.5px;margin:6px 6px 0 0}
#ct button{padding:10px 2px;font-size:12.5px}
.ddate{font-size:16px;font-weight:600;color:var(--ink);margin:2px 2px 10px;background:none;border:0;padding:0}
.moods{display:flex;gap:6px;margin:10px 0 2px}
.moods button{font-size:20px;background:none;border:1px solid var(--edge);border-radius:12px;padding:5px 10px;opacity:.45}
.moods button.on{opacity:1;background:var(--glass2)}
.bdgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bdg{padding:12px 8px;border-radius:16px;border:1px solid var(--edge);background:var(--glass);opacity:.45;text-align:center}
.bdg.on{opacity:1;background:var(--glass2);border-color:var(--bc);box-shadow:0 0 16px var(--bc)}
.bdg i{font-style:normal;font-size:26px;display:block}.bdg b{font-size:13.5px;display:block;margin:4px 0 2px}.bdg small{color:var(--muted);font-size:12px}
.big2{font-size:34px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-140px);padding:12px 18px;border-radius:16px;z-index:30;background:var(--panel);border:1px solid var(--edge);transition:transform .3s;max-width:90%;text-align:center;font-size:14px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.toast.show{transform:translate(-50%,0)}
#lock{position:fixed;inset:0;z-index:50;background-color:var(--bgc);background-image:var(--bgi);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lock.hid{display:none}
.lbox{width:100%;max-width:330px;text-align:center;padding:20px}
.lx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:48px;height:48px;padding:0;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}.lx.hid{display:none}
.lt{font-size:19px;font-weight:600;margin-bottom:18px}
.ldots{display:flex;gap:16px;justify-content:center;margin-bottom:10px}
.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.ldots i.f{background:var(--ink)}
.lerr{height:20px;color:var(--cross);font-size:13.5px;margin-bottom:10px}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lpad button{height:62px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font-size:24px}
.ovl{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;margin-bottom:12px;border:0;font:inherit;font-size:15px;font-weight:600;color:#ff0000;text-align:left}.ovl .ic{width:20px;height:20px}
.dlg{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--shade);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dbox{width:100%;max-width:340px;border-radius:22px;padding:26px 20px 20px;text-align:center;background:var(--panel);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--edge);color:var(--ink)}
.dic{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:#16A34A;color:#fff;box-shadow:0 0 0 8px rgba(22,163,74,.22)}
.dic .ic{width:32px;height:32px;stroke-width:3}
.dic.ask{background:var(--glass2);color:var(--ink);box-shadow:0 0 0 8px var(--glass)}
.dic.bad{background:#FF0000;box-shadow:0 0 0 8px rgba(255,0,0,.22)}
.dbox b{display:block;font-size:19px;margin-bottom:8px}
.dbox p{white-space:pre-line;margin:0 0 20px;color:var(--muted);font-size:14.5px;line-height:1.5}
.dbt{display:flex;gap:10px;justify-content:center}
.dbt button{flex:1;max-width:150px;height:46px;border-radius:14px;border:0;font-size:16px;font-weight:700;font-family:inherit}
.dok{background:#FF0000;color:#fff}.dc{background:var(--glass2);color:var(--ink)}
.foot{margin-top:18px;text-align:center;padding:12px 12px 10px}.foot b{display:block;font-size:12.5px;color:var(--muted)}.foot small{display:block;font-size:10px;font-weight:600;color:var(--muted)}.fi{display:flex;justify-content:center;gap:8px;align-items:center;margin:6px 6px 4px}.fi a{color:var(--ink);width:38px;height:38px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}.fi .ic{width:22px;height:22px}.fi .ic.f{fill:currentColor;stroke:none}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
#gear{color:var(--muted)}#gear .ic{width:20px;height:20px}
.mnav .ic{width:24px;height:24px}
.moods button{color:var(--muted)}.moods button.on{color:var(--ink)}.moods .ic{width:24px;height:24px}
.bdg i{width:46px;height:46px;border-radius:50%;background:var(--glass2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:var(--muted);font-size:22px}
.bdg.on i{color:var(--bc);box-shadow:inset 0 0 0 2px var(--bc)}.bdg.on small{color:var(--bc)}.bdg.on .bar i{width:100%;height:100%;margin:0;border-radius:6px;background:var(--bc);box-shadow:none}
.sw{position:relative;margin-bottom:10px}
.sw .ic{position:absolute;left:12px;top:50%;margin-top:-.575em;color:var(--muted);pointer-events:none}
.row .pri{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1;min-width:0}
#pr button,#rp button,#ct button{padding:0;font-size:12px;border-radius:9px;white-space:nowrap;min-width:0;line-height:1.3;height:34px}
input[type=text]{height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.row>button{height:34px;padding:0 14px;font-size:13px;border-radius:9px}
.seg button{height:34px;padding:0 6px;font-size:13px;border-radius:9px}
.wdays button{height:34px;padding:0;font-size:12px;border-radius:9px}
.chip{height:34px;padding:0 14px;font-size:13px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.big{height:42px;padding:0 14px;font-size:15px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.row:has(.pri)>label{flex:none;width:76px;font-size:13px}
input[type=date],input[type=time],input[type=number]{padding:0 10px;font-size:13px;border-radius:9px;height:34px;width:120px;min-width:120px;max-width:120px;flex:none;box-sizing:border-box}
input[type=number]{width:120px}
#pr button:first-child{grid-column:2}
input[type=time]::-webkit-calendar-picker-indicator{display:none}
#v-cal:not(.hid){display:flex;flex-direction:column}
#v-cal .cw{margin:0}
#v-up{overflow:hidden;padding-bottom:0}
#v-up:not(.hid){display:flex;flex-direction:column}
#v-up .sw,#v-up #ucats{flex:none}
#v-up #ulist{flex:1;min-height:0;overflow-y:auto;margin:0 -14px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 134px);overscroll-behavior:contain;scrollbar-width:none}
#v-up #ulist::-webkit-scrollbar{display:none}
#v-rep{overflow:hidden;padding-bottom:0}
#v-rep:not(.hid){display:flex;flex-direction:column}
#v-rep .seg{flex:none}
#v-rep .rscroll{flex:1;min-height:0;overflow-y:auto;margin:0 -14px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 134px);overscroll-behavior:contain;scrollbar-width:none}
#v-rep .rscroll::-webkit-scrollbar{display:none}
.chips.snap{gap:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.chips.snap::-webkit-scrollbar{display:none}
.chips.snap .chip{height:28px;padding:0 12px;font-size:12px;scroll-snap-align:start;scroll-snap-stop:always}
.chips.snap .chip{flex:0 0 calc((100% - 24px)/5);display:block;text-align:center;padding:0 4px;line-height:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips.snap .chip:not(.add) .ic{display:none}
.chips.snap .chip.add{padding:0}
.chips.snap .chip.add .ic{display:inline-block;vertical-align:middle}
.chips.snap .chip .ic{width:14px;height:14px}
#ct button{overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.frow2{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.frow2 .big{flex:1 1 0;min-width:0;margin:0;width:auto}
.fpill.rs{flex:none;width:42px;height:42px;border-radius:12px;padding:0;justify-content:center;border:0;background:none;box-shadow:none;color:var(--ink)}
.fpill.rs .ic{width:20px;height:20px}
.fpill.fsn{flex:0 0 auto;max-width:none;overflow:visible;height:42px;border-radius:12px;padding:0 9px;font-size:12px;gap:4px;white-space:nowrap}
.frow2 .big{min-width:0;padding:0 6px;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

const remIds=x=>[...Array.from({length:24},(_,i)=>4000000+x.nid*30+i),...Array.from({length:150},(_,i)=>5000000+x.nid*200+i)];
async function schedRem(x){if(!LN)return;await cancelMany(remIds(x));if(!x.on)return;await askPerm();
await safe(()=>LN.schedule({notifications:remSlots(x).map((m,i)=>({id:5000000+x.nid*200+i,title:t('todoNotifT'),body:x.name,largeIcon:'ic_large_icon',schedule:{on:{hour:Math.floor(m/60),minute:m%60},allowWhileIdle:true}}))}))}

// ---- PIN / fingerprint lock ----
let bioAv=false,lpin='',lmode='unlock',lnew='',lnext=null,lbusy=false,hiddenAt=0;
const BA=()=>window.Capacitor&&Capacitor.Plugins&&(Capacitor.Plugins.BiometricAuth||Capacitor.Plugins.NativeBiometric);
async function bioOk(){const p=BA();if(!p)return false;try{if(p.checkBiometry){const r=await p.checkBiometry();return !!r.isAvailable}if(p.isAvailable){const r=await p.isAvailable();return !!r.isAvailable}}catch(e){}return false}
async function bioAuth(){const p=BA();if(!p)return false;try{if(p.authenticate){await p.authenticate({reason:t('lockT'),cancelTitle:t('cancelT')});return true}if(p.verifyIdentity){await p.verifyIdentity({reason:t('lockT')});return true}}catch(e){}return false}
async function sha(x,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
function lockDraw(){const m=lmode;$('#lt').textContent=t(m==='set1'?'lockNew':m==='set2'?'lockConfirm':'lockT');
$('#ld').innerHTML=[0,1,2,3].map(i=>`<i class="${i<lpin.length?'f':''}"></i>`).join('');
const bb=S.lock&&S.lock.bio&&bioAv&&(m==='unlock'||m==='check');
$('#lp').innerHTML=['1','2','3','4','5','6','7','8','9',bb?'bio':'','0','bk'].map(k=>k?`<button data-k="${k}">${k==='bk'?ic('back'):k==='bio'?ic('finger'):dig(k)}</button>`:'<span></span>').join('');
$('#lp').querySelectorAll('button').forEach(b=>b.onclick=()=>lockKey(b.dataset.k));
$('#lcx').classList.toggle('hid',m==='unlock')}
function showLock(mode,next){lmode=mode;lnext=next||null;lpin='';lnew='';$('#le').textContent='';$('#lock').classList.remove('hid');lockDraw();
if((mode==='unlock'||mode==='check')&&S.lock&&S.lock.bio&&bioAv)tryBio()}
function lockOk(){$('#lock').classList.add('hid');if(lnext){const f=lnext;lnext=null;f()}}
function lockErr(m){$('#le').textContent=m;lpin='';try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}lockDraw()}
async function tryBio(){if(S.lock&&S.lock.bio&&await bioAuth())lockOk()}
function lockKey(k){$('#le').textContent='';if(k==='bk')lpin=lpin.slice(0,-1);else if(k==='bio'){tryBio();return}else if(lpin.length<4){lpin+=k;if(lpin.length===4){lockDraw();lockDone();return}}lockDraw()}
async function lockDone(){if(lbusy)return;lbusy=true;try{
if(lmode==='unlock'||lmode==='check'){if(await sha(lpin,S.lock.salt)===S.lock.h)lockOk();else lockErr(t('lockBad'))}
else if(lmode==='set1'){lnew=lpin;lpin='';lmode='set2';lockDraw()}
else if(lmode==='set2'){if(lpin===lnew){const salt=Math.random().toString(36).slice(2)+Date.now();S.lock={h:await sha(lnew,salt),salt,bio:!!(S.lock&&S.lock.bio)};save();$('#lock').classList.add('hid');toast(t('lockOn'));render()}else{lmode='set1';lockErr(t('lockMis'))}}
