<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HabitX</title>
<style>
:root{--bgc:#000;--bgi:none;--ink:#F4F4F5;--muted:rgba(244,244,245,.56);--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.16);--edge:rgba(255,255,255,.18);--hi:rgba(255,255,255,.2);--sh:rgba(0,0,0,.5);--panel:rgba(22,22,26,.78);--daybg:rgba(255,255,255,.06);--cross:#FF8FA3;--streak:#FFD27A;--shade:rgba(0,0,0,.6);--ac:#14B8A6;--tink:#041014;--mono:#fff}
:root[data-theme=light]{--mono:#000;--bgc:#E6EEF5;--bgi:radial-gradient(circle at 12% 6%,rgba(94,234,212,.55),transparent 42%),radial-gradient(circle at 92% 28%,rgba(167,139,250,.45),transparent 45%),radial-gradient(circle at 18% 96%,rgba(251,146,160,.4),transparent 45%);--ink:#10253A;--muted:rgba(16,37,58,.6);--glass:rgba(255,255,255,.5);--glass2:rgba(255,255,255,.78);--edge:rgba(255,255,255,.95);--hi:rgba(255,255,255,.9);--sh:rgba(40,70,110,.18);--panel:rgba(244,249,255,.85);--daybg:rgba(255,255,255,.45);--cross:#D6336C;--streak:#B7791F;--shade:rgba(16,37,58,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bgc)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bgi);background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;overscroll-behavior:none}
html{overflow:hidden;height:100%;overscroll-behavior:none;touch-action:pan-x pan-y}
html,body{overscroll-behavior-y:none}
.top{flex:none}
body>section{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 134px);scrollbar-width:none}
body>section::-webkit-scrollbar{display:none}

button{font-family:inherit}
.g{background:var(--glass);border:1px solid var(--edge);border-radius:18px;box-shadow:0 8px 28px var(--sh),inset 0 1px 0 var(--hi)}

.sheet{position:fixed;inset:0;background:var(--shade);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:flex-end;z-index:10}

.panel{width:100%;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:90vh;overflow:auto;background:var(--panel);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--edge);border-bottom:0}

.bdgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.bdg i{font-style:normal;font-size:26px;display:block}.bdg b{font-size:13.5px;display:block;margin:4px 0 2px}.bdg small{color:var(--muted);font-size:12px}
.big2{font-size:34px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-140px);padding:12px 18px;border-radius:16px;z-index:30;background:var(--panel);border:1px solid var(--edge);transition:transform .3s;max-width:90%;text-align:center;font-size:14px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

#lock{position:fixed;inset:0;z-index:50;background-color:var(--bgc);background-image:var(--bgi);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.lt{font-size:19px;font-weight:600;margin-bottom:18px}
.ldots{display:flex;gap:16px;justify-content:center;margin-bottom:10px}
.ldots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.ldots i.f{background:var(--ink)}
.lerr{height:20px;color:var(--cross);font-size:13.5px;margin-bottom:10px}
.lpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lpad button{height:62px;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font-size:24px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
#gear{color:var(--muted)}#gear .ic{width:20px;height:20px}
.mnav .ic{width:24px;height:24px}
.moods button{color:var(--muted)}.moods button.on{color:var(--ink)}.moods .ic{width:24px;height:24px}
.bdg i{width:46px;height:46px;border-radius:50%;background:var(--glass2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;color:var(--muted);font-size:22px}
.bdg.on i{color:var(--ink)}
.sw{position:relative;margin-bottom:10px}
.sw .ic{position:absolute;left:12px;top:50%;margin-top:-.575em;color:var(--muted);pointer-events:none}
.row .pri{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:1;min-width:0}
#pr button,#rp button,#ct button{padding:0;font-size:12px;border-radius:9px;white-space:nowrap;min-width:0;line-height:1.3;height:34px}
input[type=text]{height:34px;padding:0 10px;font-size:13px;border-radius:9px}
.row>button{height:34px;padding:0 14px;font-size:13px;border-radius:9px}

#v-cal:not(.hid){display:flex;flex-direction:column}

.frow{display:flex;gap:8px;justify-content:center;margin-top:2px}

/* Moon-dependent holidays: when the phone is online the app fetches the year's official list
   (a tiny holidays.json) and keeps it on the device. Once the year is marked final it stops asking. */
const HOL_URL='';/* e.g. https://raw.githubusercontent.com/<username>/<repo>/main/holidays.json */
const holCache=()=>{try{return JSON.parse(localStorage.getItem('hb_hol')||'null')}catch(e){return null}};
const holMerge=d=>{if(!d)return;Object.keys(d).forEach(y=>{if(/^\d{4}$/.test(y)&&d[y]&&typeof d[y]==='object')HOL_YEARLY[y]=d[y]})};
{const c=holCache();if(c)holMerge(c.data)}
async function holSync(){
if(!HOL_URL||!navigator.onLine)return;
const c=holCache(),dt=new Date(),Y=dt.getFullYear(),fin=(c&&c.final)||[];
if(c&&fin.includes(Y)&&(dt.getMonth()<9||fin.includes(Y+1)))return;
if(c&&Date.now()-c.at<43200000)return;
try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
const r=await fetch(HOL_URL+'?t='+Date.now(),{signal:ctl.signal,cache:'no-store'});clearTimeout(to);
if(!r.ok)return;const j=await r.json(),data={};
Object.keys(j.years||{}).forEach(y=>{if(/^\d{4}$/.test(y)&&j.years[y]&&typeof j.years[y]==='object')data[y]=j.years[y]});
if(!Object.keys(data).length)return;
localStorage.setItem('hb_hol',JSON.stringify({at:Date.now(),final:(j.final||[]).map(Number),data}));
holMerge(data);render()}catch(e){}}
window.addEventListener('online',holSync);

async function sha(x,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of salt+x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'x'+h}}
function lockDraw(){const m=lmode;$('#lt').textContent=t(m==='set1'?'lockNew':m==='set2'?'lockConfirm':'lockT');
$('#ld').innerHTML=[0,1,2,3].map(i=>`<i class="${i<lpin.length?'f':''}"></i>`).join('');
const bb=S.lock&&S.lock.bio&&bioAv&&(m==='unlock'||m==='check');
$('#lp').innerHTML=['1','2','3','4','5','6','7','8','9',bb?'bio':'','0','bk'].map(k=>k?`<button data-k="${k}">${k==='bk'?ic('back'):k==='bio'?ic('finger'):dig(k)}</button>`:'<span></span>').join('');
$('#lp').querySelectorAll('button').forEach(b=>b.onclick=()=>lockKey(b.dataset.k));
$('#lcx').classList.toggle('hid',m==='unlock')}
function showLock(mode,next){lmode=mode;lnext=next||null;lpin='';lnew='';$('#le').textContent='';$('#lock').classList.remove('hid');lockDraw();
if((mode==='unlock'||mode==='check')&&S.lock&&S.lock.bio&&bioAv)tryBio()}

async function lockDone(){if(lbusy)return;lbusy=true;try{
if(lmode==='unlock'||lmode==='check'){if(await sha(lpin,S.lock.salt)===S.lock.h)lockOk();else lockErr(t('lockBad'))}
else if(lmode==='set1'){lnew=lpin;lpin='';lmode='set2';lockDraw()}

}finally{lbusy=false}}

const TPH=44;

function tpWheel(el,items,start,loop){
const n=items.length,C=loop?7:1;let h='';
for(let c=0;c<C;c++)items.forEach((x,i)=>h+=`<div class="tpit" data-k="${c*n+i}">${x}</div>`);
el.innerHTML=h;const its=el.children;let cur=-1;
const idx=()=>Math.max(0,Math.min(C*n-1,Math.round(el.scrollTop/TPH)));
const paint=()=>{const k=idx();if(k===cur)return;for(let j=cur-1;j<=cur+1;j++)if(its[j])its[j].className='tpit';cur=k;if(its[k-1])its[k-1].className='tpit nb';if(its[k+1])its[k+1].className='tpit nb';its[k].className='tpit on'};
el.scrollTop=((loop?3*n:0)+start)*TPH;paint();
let to;el.addEventListener('scroll',()=>{paint();clearTimeout(to);to=setTimeout(()=>{if(loop){const k=idx();if(k<2*n||k>=5*n){el.scrollTop=(3*n+k%n)*TPH}}},160)});
el.onclick=e=>{const it=e.target.closest('.tpit');if(it)el.scrollTo({top:(+it.dataset.k)*TPH,behavior:'smooth'})};
return()=>idx()%n}
